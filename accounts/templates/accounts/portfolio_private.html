
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillProof | Private Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #172554;
            color: white;
            padding: 20px 7%;
            font-size: 25px;
            font-weight: 800;
        }

        nav span {
            color: #a5b4fc;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .private-card {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(15,23,42,0.08);
        }

        .lock-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            color: #172554;
            font-size: 27px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            padding: 9px 17px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin: 10px 0 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media(max-width: 500px) {
            .private-card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>

</head>

<body>

    <nav>
        Skill<span>Proof.</span>
    </nav>

    <main class="container">

        <section class="private-card">

            <div class="lock-icon">
                🔒
            </div>

            <h1>Portfolio is Private</h1>

            <span class="status">
                PRIVATE ACCESS
            </span>

            <p>
                This student's SkillProof portfolio is currently private.
            </p>

            <p>
                The student has not enabled public portfolio access.
                Please contact the student and request access.
            </p>

        </section>

    </main>

    <footer>
        SkillProof – Beyond Certificates, Prove Your Skills.
    </footer>

</body>

</html>
